<!doctype html>
<meta charset="utf-8">
<title>CHAOS CREW intro</title>
<style>
  @font-face { font-family: "Bangers"; src: url("fonts/Bangers.ttf"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
<canvas id="c"></canvas>
<script src="lipsync.js"></script>
<script>
// CHAOS CREW — 15 s YouTube intro. Characters are cutouts of the supplied artwork (layers/*.png), never repainted.
const W = 1920, H = 1080, FPS = 30, DURATION = 15;
window.PIECE = { width: W, height: H, fps: FPS, duration: DURATION };
const TL = {luck: 0.55, hollow: 2.40, light: 3.20, echo: 4.48, beat: 5.60, music: 6.00, sprint: 6.10,
  boom: 7.20, launch: 7.60, shot2: 9.00, hit: 11.60, slide: 12.00, title: 14.00, end: 15.00};
const LINES = {luck: "What is that ticking noise?", hollow: "RUN!", light: "Why?", echo: "Because we set off a bomb!"};

const canvas = document.getElementById("c");
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext("2d");

const rng = (seed) => () => {
  seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - (1 - x) ** 3;
const easeIn = (x) => x * x * x;
const easeInOut = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
const lerp = (a, b, x) => a + (b - a) * x;
const spring = (x, k = 9, d = 5) => x <= 0 ? 0 : 1 - Math.exp(-d * x) * Math.cos(k * x);  // overshooting 0->1
const layer = (w = W, h = H) => Object.assign(document.createElement("canvas"), { width: w, height: h });
const load = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

// ---------------- characters: @2x cutouts, mouth anchors in layer px ----------------
const NAMES = ["echo", "luck", "hollow", "light"];
const MOUTH = { echo: [284, 163, 46, 30], luck: [456, 268, 54, 50], light: [366, 330, 78, 54] };
const EYES = { hollow: [202, 276] };
const FACE = { echo: [284, 150], luck: [456, 240], hollow: [202, 260], light: [366, 300] };   // for FX placement
// stage: bottom-centre anchor, scale relative to @2x layer
const BASE = { echo: {x: 305, y: 880, s: 0.64}, luck: {x: 700, y: 990, s: 0.64},
               hollow: {x: 1262, y: 990, s: 0.64}, light: {x: 1600, y: 990, s: 0.64} };
const IMG = {};
let BG, FG, LOG, SMOKE = [], SPARKS = [], DEBRIS = [], STARS = [], STREAKS = [];

// ---------------- ticks (same formula as sound.py) ----------------
const TICKS = [];
{ let t = 0.15, k = 0; while (t < TL.beat - 0.05) { TICKS.push(t); const p = t / TL.beat; t += 0.42 * (1 - 0.83 * p ** 1.2); k++; } }
const tickPulse = (t) => { let best = 0; for (const tk of TICKS) if (t >= tk) best = Math.max(best, Math.exp(-(t - tk) * 14)); return t < TL.beat ? best : 0; };

// ---------------- painting helpers ----------------
function pine(g, x, y, h, w, col) {
  g.fillStyle = col; g.beginPath();
  const tiers = 5;
  for (let i = 0; i < tiers; i++) {
    const ty = y - h + (h * i) / tiers, by = ty + h / tiers * 1.6, ww = w * (0.35 + 0.65 * (i + 1) / tiers);
    g.moveTo(x, ty); g.lineTo(x + ww / 2, by); g.lineTo(x - ww / 2, by); g.closePath();
  }
  g.fill(); g.fillRect(x - w * 0.05, y - h * 0.05, w * 0.1, h * 0.12);
}
function puff(g, x, y, r, col, a = 1, seed = 1, lumps = 7) {
  g.save(); g.globalAlpha *= a; g.fillStyle = col; g.beginPath();
  for (let i = 0; i < lumps; i++) {
    const ang = (i / lumps) * Math.PI * 2 + hash(seed + i) * 0.6;
    const rr = r * (0.45 + 0.3 * hash(seed * 3 + i));
    g.moveTo(x + Math.cos(ang) * r * 0.5 + rr, y + Math.sin(ang) * r * 0.45);
    g.arc(x + Math.cos(ang) * r * 0.5, y + Math.sin(ang) * r * 0.45, rr, 0, Math.PI * 2);
  }
  g.moveTo(x + r * 0.7, y); g.arc(x, y, r * 0.7, 0, Math.PI * 2);
  g.fill(); g.restore();
}
function star(g, x, y, r, rot, col) {
  g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.45 : r; const a = (i / 10) * Math.PI * 2 - Math.PI / 2; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  g.closePath(); g.fill(); g.lineWidth = r * 0.18; g.strokeStyle = "#1a1030"; g.stroke(); g.restore();
}
function comicText(g, text, x, y, size, fill, rot = 0, scale = 1, outline = "#0b0b18") {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(scale, scale);
  g.font = `${size}px Bangers`; g.textAlign = "center"; g.textBaseline = "middle";
  g.lineJoin = "round"; g.lineWidth = size * 0.22; g.strokeStyle = outline; g.strokeText(text, 0, 0);
  g.lineWidth = size * 0.1; g.strokeStyle = "#ffffff"; g.strokeText(text, 0, 0);
  g.fillStyle = fill; g.fillText(text, 0, 0); g.restore();
}

// ---------------- ready: paint static layers once ----------------
window.ready = (async () => {
  await document.fonts.load('80px "Bangers"'); await document.fonts.ready;
  for (const n of NAMES) IMG[n] = await load(`layers/${n}@2x.png`);
  IMG.title = await load("layers/title@2x.png");
  IMG.moon = await load("layers/moon.png");
  for (const n of NAMES) {  // silhouettes for the impact frame
    const c = layer(IMG[n].width, IMG[n].height), g = c.getContext("2d");
    g.drawImage(IMG[n], 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = "#07060d"; g.fillRect(0, 0, c.width, c.height);
    IMG[n + "_sil"] = c;
  }
  const R = rng(42);
  // night forest background in the reference palette
  BG = layer(); const b = BG.getContext("2d");
  const sky = b.createLinearGradient(0, 0, 0, 820);
  sky.addColorStop(0, "#050817"); sky.addColorStop(0.55, "#0e1a52"); sky.addColorStop(1, "#1d2f86");
  b.fillStyle = sky; b.fillRect(0, 0, W, H);
  for (let i = 0; i < 160; i++) { b.fillStyle = `rgba(200,220,255,${0.3 + 0.6 * R()})`; b.beginPath(); b.arc(R() * W, R() * 520, 0.6 + R() * 1.8, 0, 7); b.fill(); }
  const glow = b.createRadialGradient(1450, 170, 20, 1450, 170, 420); glow.addColorStop(0, "rgba(150,190,255,0.35)"); glow.addColorStop(1, "rgba(150,190,255,0)");
  b.fillStyle = glow; b.fillRect(0, 0, W, H);
  b.drawImage(IMG.moon, 1450 - 95, 170 - 95, 190, 190);
  for (let i = 0; i < 26; i++) pine(b, -40 + i * 80 + R() * 40, 700 + R() * 40, 380 + R() * 200, 170 + R() * 60, "#0b1640");
  for (let i = 0; i < 16; i++) pine(b, -60 + i * 135 + R() * 60, 780 + R() * 30, 460 + R() * 220, 230 + R() * 70, "#081030");
  const mist = b.createLinearGradient(0, 600, 0, 820); mist.addColorStop(0, "rgba(60,90,200,0)"); mist.addColorStop(1, "rgba(60,90,200,0.35)");
  b.fillStyle = mist; b.fillRect(0, 600, W, 220);
  const gr = b.createLinearGradient(0, 780, 0, H); gr.addColorStop(0, "#132a3a"); gr.addColorStop(1, "#06101a");
  b.fillStyle = gr; b.beginPath(); b.moveTo(0, 800); b.quadraticCurveTo(960, 760, W, 800); b.lineTo(W, H); b.lineTo(0, H); b.fill();
  for (let i = 0; i < 500; i++) { const x = R() * W, y = 790 + R() * 290; b.strokeStyle = `rgba(${40 + R() * 40},${90 + R() * 70},${70 + R() * 40},0.8)`; b.lineWidth = 2; b.beginPath(); b.moveTo(x, y); b.lineTo(x + (R() - 0.5) * 10, y - 8 - R() * 14); b.stroke(); }
  // Echo's log (she sits on one in the reference)
  LOG = layer(520, 160); const l = LOG.getContext("2d");
  const lg = l.createLinearGradient(0, 20, 0, 150); lg.addColorStop(0, "#7a4527"); lg.addColorStop(0.5, "#4a2614"); lg.addColorStop(1, "#24110a");
  l.fillStyle = lg; l.strokeStyle = "#140805"; l.lineWidth = 6; l.beginPath(); l.roundRect(10, 30, 470, 110, 50); l.fill(); l.stroke();
  l.fillStyle = "#b8774a"; l.beginPath(); l.ellipse(470, 85, 32, 54, 0, 0, 7); l.fill(); l.stroke();
  l.strokeStyle = "#6e3b1f"; l.lineWidth = 4; for (let r = 10; r < 50; r += 12) { l.beginPath(); l.ellipse(470, 85, r * 0.6, r, 0, 0, 7); l.stroke(); }
  l.strokeStyle = "rgba(20,8,4,0.7)"; l.lineWidth = 4; for (let i = 0; i < 12; i++) { const x = 40 + R() * 380; l.beginPath(); l.moveTo(x, 45 + R() * 20); l.lineTo(x + 40 + R() * 40, 60 + R() * 60); l.stroke(); }
  l.fillStyle = "rgba(120,170,255,0.18)"; l.fillRect(20, 34, 450, 10);
  // foreground bushes/grass hiding the bottom edge of every cutout
  FG = layer(); const f = FG.getContext("2d");
  for (let i = 0; i < 46; i++) { const x = i * 44 + R() * 30, y = 905 + R() * 40; puff(f, x, y + 60, 60 + R() * 40, "#0a1a22", 1, i + 9); }
  for (let i = 0; i < 46; i++) { const x = i * 44 + R() * 30, y = 905 + R() * 40; puff(f, x, y + 30, 38 + R() * 24, "#10283a", 1, i + 99); }
  f.fillStyle = "#081219"; f.fillRect(0, 990, W, 90);
  for (let i = 0; i < 380; i++) { const x = R() * W, y = 900 + R() * 180; f.strokeStyle = `rgba(${60 + R() * 60},${140 + R() * 80},${200 + R() * 55},${0.25 + R() * 0.4})`; f.lineWidth = 2.4; f.beginPath(); f.moveTo(x, y); f.quadraticCurveTo(x + 4, y - 14, x + (R() - 0.5) * 16, y - 22 - R() * 22); f.stroke(); }
  // explosion particles
  for (let i = 0; i < 46; i++) SMOKE.push({a: R() * Math.PI * 2, d: 0.25 + R() * 0.8, r: 70 + R() * 120, s: R(), col: R()});
  for (let i = 0; i < 90; i++) SPARKS.push({a: -Math.PI * R(), v: 700 + R() * 1500, l: 30 + R() * 70, hue: R()});
  for (let i = 0; i < 22; i++) DEBRIS.push({a: -0.2 - R() * 2.7, v: 600 + R() * 900, spin: (R() - 0.5) * 18, sz: 14 + R() * 30, kind: R()});
  for (let i = 0; i < 70; i++) STREAKS.push({a: R() * Math.PI * 2, s: R(), w: 2 + R() * 6, sp: 0.6 + R()});
  for (let i = 0; i < 40; i++) STARS.push({a: R() * Math.PI * 2, d: R(), s: R()});
})();

// ---------------- lipsync ----------------
function mouthOpen(name, t) {
  const L = window.LIPS && window.LIPS[name]; if (!L) return null;
  const f = (t - L.start) * FPS; if (f < -1 || f > L.env.length + 2) return null;
  const i = Math.floor(f), a = f - i, e = (k) => L.env[clamp(k, 0, L.env.length - 1)] || 0;
  return lerp(e(i), e(i + 1), a);
}
const work = layer(800, 1000), wg = work.getContext("2d");
const mcan = layer(300, 260), mg = mcan.getContext("2d");
// Returns the character image for this frame, with the mouth region stretched by speech (the drawing itself is untouched).
function charImage(name, t, silhouette = false) {
  if (silhouette) return IMG[name + "_sil"];
  const img = IMG[name], m = MOUTH[name], open = mouthOpen(name, t);
  if (!m || open === null) return img;
  // The art's mouths are already open, so speech only opens them wider: rows below the upper lip are stretched
  // downward (jaw drop) inside a feathered ellipse, then the image returns exactly to the original drawing.
  const [cx, cy, rx, ry] = m, sy = 1 + (name === "echo" ? 0.3 : 0.5) * clamp(open);
  work.width = img.width; work.height = img.height; wg.drawImage(img, 0, 0);
  if (sy < 1.01) return work;
  const bw = Math.round(rx * 2.6), bh = Math.round(ry * 3.2), x0 = Math.round(cx - bw / 2), y0 = Math.round(cy - bh / 2);
  const lip = Math.round(ry * 0.55);                      // upper-lip row inside the box
  mcan.width = bw; mcan.height = bh;
  mg.drawImage(img, x0, y0, bw, bh, 0, 0, bw, bh);
  mg.drawImage(img, x0, y0 + lip, bw, bh - lip, 0, lip, bw, (bh - lip) * sy);
  mg.globalCompositeOperation = "destination-in";
  mg.save(); mg.translate(bw / 2, bh / 2 + ry * 0.2); mg.scale(1, (ry * 1.35) / (rx * 1.2));
  const rg = mg.createRadialGradient(0, 0, 0, 0, 0, rx * 1.2);
  rg.addColorStop(0, "rgba(0,0,0,1)"); rg.addColorStop(0.7, "rgba(0,0,0,1)"); rg.addColorStop(1, "rgba(0,0,0,0)");
  mg.fillStyle = rg; mg.fillRect(-bw, -bh * 2, bw * 2, bh * 4); mg.restore();
  mg.globalCompositeOperation = "source-over";
  wg.drawImage(mcan, x0, y0);
  return work;
}

// ---------------- character motion (pure functions of t) ----------------
const DIR = { echo: -1, luck: -1, hollow: 1, light: 1 };
function stage1(name, t) {
  const B = BASE[name]; let x = B.x, y = B.y, s = B.s, rot = 0, sx = 1, sy = 1 + 0.012 * Math.sin(t * 3 + B.x);
  // acting before the bomb
  if (name === "luck") {   // looks around, confused
    const look = prog(t, 0.15, 2.0);
    rot = 0.07 * Math.sin(look * Math.PI * 3) * (look > 0 && look < 1 ? 1 : 0);
    y -= 14 * Math.abs(Math.sin(prog(t, 0.2, 0.5) * Math.PI));
  }
  if (name === "hollow") {   // notices, turns to the group, urgent
    const n = prog(t, 2.1, 2.3); y -= 22 * Math.sin(n * Math.PI); rot = -0.12 * easeOut(prog(t, 2.15, 2.35)) * (1 - prog(t, 3.0, 3.3));
    const sh = prog(t, 2.4, 2.9); if (sh > 0 && sh < 1) { x += Math.sin(t * 90) * 5; s *= 1 + 0.07 * Math.sin(sh * Math.PI); }
  }
  if (name === "light") {   // confused head tilt
    rot = 0.11 * easeOut(prog(t, 3.1, 3.3)) * (1 - prog(t, 4.0, 4.3));
  }
  if (name === "echo") {    // glance at the bomb, back, blurt
    const g1 = easeInOut(prog(t, 3.95, 4.15)), g2 = easeInOut(prog(t, 4.3, 4.45));
    rot = 0.16 * (g1 - g2); x += 26 * (g1 - g2);
    const bl = prog(t, 4.48, 5.6); if (bl > 0 && bl < 1) { y -= 10 * Math.abs(Math.sin(bl * Math.PI * 5)); s *= 1 + 0.04 * Math.sin(bl * Math.PI); }
  }
  // the comedic beat: everyone freezes, tiny "gulp" squash
  const bt = prog(t, TL.beat, TL.music);
  if (bt > 0 && bt < 1) { const q = Math.sin(prog(t, TL.beat + 0.1, TL.beat + 0.25) * Math.PI); sy *= 1 - 0.05 * q; sx *= 1 + 0.03 * q; rot *= 0.3; }
  // panic sprint toward the camera, away from the bomb behind them
  if (t >= TL.music) {
    const a = prog(t, TL.music, TL.sprint);
    sy *= 1 - 0.14 * Math.sin(a * Math.PI); sx *= 1 + 0.1 * Math.sin(a * Math.PI);
    const r = prog(t, TL.sprint, TL.launch), ph = { echo: 0, luck: 1.3, hollow: 2.1, light: 0.7 }[name];
    if (t >= TL.sprint) {
      y += -Math.abs(Math.sin((t - TL.sprint) * Math.PI * 7 + ph)) * 26 + 90 * easeInOut(r);
      x += (B.x - 960) * 0.28 * easeInOut(r) + Math.sin((t + ph) * 40) * 4;
      s *= 1 + 0.32 * easeInOut(r);
      rot = 0.06 * Math.sin((t - TL.sprint) * Math.PI * 7 + ph) + 0.05 * DIR[name];
      if (name === "echo") y += 40 * easeInOut(r);   // hops off the log
    }
  }
  // blast wave launches them up and toward the lens, spinning
  if (t >= TL.launch) {
    const l = prog(t, TL.launch, 8.75), e = easeIn(l);
    y -= 1500 * e + 120 * Math.sin(l * Math.PI); x += (B.x - 960) * 0.5 * l; s *= 1 + 0.9 * l;
    rot += DIR[name] * (l * l * 7); sy *= 1 + 0.12 * Math.sin(prog(t, TL.launch, TL.launch + 0.2) * Math.PI);
  }
  return {x, y, s, rot, sx, sy};
}
// shot 2: flying at the camera from deep in the explosion
const GLASS = { echo: {x: 238, y: 1092, s: 1.45, r: -0.08}, luck: {x: 700, y: 1086, s: 1.0, r: 0.05},
                hollow: {x: 1285, y: 1090, s: 1.15, r: -0.04}, light: {x: 1620, y: 1086, s: 1.08, r: 0.07} };
const START = { echo: [-70, 20], luck: [-25, -30], hollow: [25, -15], light: [70, 25] };
function stage2(name, t) {
  const G = GLASS[name], u = prog(t, TL.shot2, TL.hit), c = 0.88;
  const p = (1 - c) / (1 - c * u);           // perspective: 0.06 -> 1, constant real speed
  const cx = 960 + START[name][0], cy = 560 + START[name][1];
  const img = IMG[name];
  const fy = G.y - img.height * G.s * 0.5;      // glass centre
  const x = lerp(cx, G.x, p), yc = lerp(cy, fy, p), s = G.s * p;
  const rot = G.r + DIR[name] * (1 - u) ** 2 * Math.PI * 5;
  return {x, y: yc + img.height * s * 0.5, s, rot, sx: 1, sy: 1};
}
function stage3(name, t) {     // squashed on the glass, then stick-slip slide down
  const G = GLASS[name], img = IMG[name];
  const k = prog(t, TL.hit, TL.hit + 0.35);
  const squash = Math.exp(-k * 4) * Math.cos(k * 18);
  let sx = 1.1 - 0.08 * (1 - k) + 0.05 * squash, sy = 0.92 + 0.06 * squash;
  const off = { echo: 0.05, luck: 0, hollow: 0.12, light: 0.08 }[name];
  const st = Math.max(0, t - TL.slide - off);
  // stick (tremble) -> slips in little jerks -> accelerates off the bottom
  let y = G.y + Math.sin(t * 70) * 2 * (st < 0.35 ? 1 : 0);
  const sl = Math.max(0, st - 0.3);
  y += 40 * Math.floor(sl / 0.33) + 40 * easeOut(clamp((sl % 0.33) / 0.12)) * (sl > 0 ? 1 : 0) + 1500 * Math.max(0, sl - 0.7) ** 2;
  const rot = G.r + 0.04 * Math.sin(sl * 3 + off * 10) * (sl > 0 ? 1 : 0);
  return {x: G.x, y, s: G.s, rot, sx, sy};
}
function drawChar(g, name, st, t, opts = {}) {
  const img = opts.sil ? charImage(name, t, true) : charImage(name, t);
  const w = IMG[name].width, h = IMG[name].height;
  g.save(); g.globalAlpha *= (opts.alpha ?? 1);
  g.translate(st.x, st.y); g.rotate(st.rot); g.scale(st.s * st.sx, st.s * st.sy);
  if (opts.blur) g.filter = `blur(${opts.blur}px)`;
  g.drawImage(img, -w / 2, -h, w, h);
  if (name === "hollow" && !opts.sil) {      // Hollow talks with his glowing eyes (no visible mouth in the art)
    const o = mouthOpen("hollow", t), alert = Math.exp(-Math.max(0, t - 2.1) * 3) * (t > 2.1 ? 1 : 0);
    const e = Math.max(o ?? 0, alert * 0.8);
    if (e > 0.02) {
      const [ex, ey] = EYES.hollow; g.globalCompositeOperation = "lighter";
      const rg = g.createRadialGradient(ex - w / 2, ey - h, 0, ex - w / 2, ey - h, 130);
      rg.addColorStop(0, `rgba(120,190,255,${0.85 * e})`); rg.addColorStop(1, "rgba(60,120,255,0)");
      g.fillStyle = rg; g.fillRect(ex - w / 2 - 140, ey - h - 140, 280, 280);
    }
  }
  g.restore();
}
// screen-space position of a point in the character's layer
function anchor(name, st, lx, ly) {
  const w = IMG[name].width, h = IMG[name].height;
  const px = (lx - w / 2) * st.s * st.sx, py = (ly - h) * st.s * st.sy;
  return [st.x + px * Math.cos(st.rot) - py * Math.sin(st.rot), st.y + px * Math.sin(st.rot) + py * Math.cos(st.rot)];
}

// ---------------- props & FX ----------------
function drawBomb(g, t) {
  const x = 1016, y = 790, r = 58, tp = tickPulse(t);
  g.save(); g.translate(x, y); const sq = 1 + 0.06 * tp; g.scale(sq, 2 - sq);
  g.fillStyle = "rgba(0,0,0,0.45)"; g.beginPath(); g.ellipse(0, r * 0.95, r * 1.1, 14, 0, 0, 7); g.fill();
  const rg = g.createRadialGradient(-r * 0.35, -r * 0.4, 5, 0, 0, r);
  rg.addColorStop(0, "#5a5a78"); rg.addColorStop(0.35, "#1c1c2c"); rg.addColorStop(1, "#06060c");
  g.fillStyle = rg; g.strokeStyle = "#000"; g.lineWidth = 5; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.stroke();
  g.fillStyle = "#3a3a4e"; g.fillRect(-16, -r - 14, 32, 18); g.strokeRect(-16, -r - 14, 32, 18);
  g.strokeStyle = "#c9a36a"; g.lineWidth = 5; g.beginPath(); g.moveTo(0, -r - 14); g.quadraticCurveTo(22, -r - 50, 8, -r - 66); g.stroke();
  // fuse spark

  ctx.fillStyle = "rgba(200,230,255,0.10)"; ctx.beginPath(); ctx.moveTo(1500, 0); ctx.lineTo(1640, 0); ctx.lineTo(1340, H); ctx.lineTo(1200, H); ctx.fill();
  ctx.restore();
  ctx.restore();
  const fl = 1 - prog(t, TL.hit, TL.hit + 0.18);
  if (fl > 0) { ctx.fillStyle = `rgba(255,255,255,${0.9 * fl})`; ctx.fillRect(0, 0, W, H); }
  comicText(ctx, "SPLAT!", 960, 140, 120 * spring(prog(t, TL.hit, TL.hit + 0.3) * 1.2, 14, 6), "#ffe14a", -0.08, 1);
}
function titleBg(g, t) {
  const rg = g.createRadialGradient(960, 520, 40, 960, 540, 1100);
  rg.addColorStop(0, "#1b3fb0"); rg.addColorStop(0.45, "#0b1650"); rg.addColorStop(1, "#03050f");
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.save(); g.lineCap = "round";
  for (const s of STREAKS) {   // electric blue streaks (gaming energy) radiating from the slam
    const e = t - TL.title, ph = (e * s.sp * 0.8 + s.s) % 1, r0 = 300 + ph * 900;
    g.strokeStyle = `rgba(90,190,255,${0.4 * (1 - ph)})`; g.lineWidth = s.w;
    g.beginPath(); g.moveTo(960 + Math.cos(s.a) * r0, 530 + Math.sin(s.a) * r0 * 0.6); g.lineTo(960 + Math.cos(s.a) * (r0 + 120), 530 + Math.sin(s.a) * (r0 + 120) * 0.6); g.stroke();
  }
  g.restore();
}
function shotTitle(t) {
  // characters finish sliding out underneath while the title drops in
  const pre = t < TL.title;
  if (pre) shotGlass(t);
  else { const [sx, sy] = shakeAt(t); ctx.save(); ctx.translate(sx, sy); titleBg(ctx, t); ctx.restore(); }
  const e = t - TL.title, img = IMG.title, base = 1250 / img.width;
  let sc, alpha = 1;
  if (e < 0) { const k = prog(t, TL.title - 0.16, TL.title); sc = lerp(3.2, 1.0, easeIn(k)); alpha = k; }
  else sc = 1 + 0.16 * Math.exp(-e * 9) * Math.cos(e * 30);
  if (alpha <= 0) return;
  const [sx, sy] = shakeAt(t);
  const draw = (s, a, blur = 0) => { ctx.save(); ctx.globalAlpha = a; if (blur) ctx.filter = `blur(${blur}px)`; ctx.translate(960 + sx, 520 + sy); ctx.scale(base * s, base * s); ctx.drawImage(img, -img.width / 2, -img.height / 2); ctx.restore(); };
  if (e >= 0) {   // glow behind the logo
    const gg = ctx.createRadialGradient(960, 520, 50, 960, 520, 760);
    gg.addColorStop(0, `rgba(80,170,255,${0.45 + 0.1 * Math.sin(e * 8)})`); gg.addColorStop(1, "rgba(80,170,255,0)");
    ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
  }
  if (e < 0.12) for (let k = 3; k >= 1; k--) draw(sc * (1 + k * 0.12), 0.18 * alpha, 6);
  draw(sc, alpha);
  if (e >= 0) {
    // shockwave + sparks + flash on the impact frame
    const k = prog(t, TL.title, TL.title + 0.4);
    ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = "#bfe6ff"; ctx.lineWidth = 26 * (1 - k) + 2;
    ctx.beginPath(); ctx.ellipse(960, 540, 300 + 1100 * easeOut(k), 160 + 600 * easeOut(k), 0, 0, 7); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.lineCap = "round";
    for (let i = 0; i < 40; i++) {
      const s = SPARKS[i], d = 420 + 900 * easeOut(clamp(e / 0.6)) * (0.5 + s.hue), a = 1 - clamp(e / 0.6);
      if (a <= 0) break;
      const ang = (i / 40) * Math.PI * 2;
      ctx.strokeStyle = i % 3 ? `rgba(120,210,255,${a})` : `rgba(255,255,255,${a})`; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(960 + Math.cos(ang) * d, 530 + Math.sin(ang) * d * 0.55); ctx.lineTo(960 + Math.cos(ang) * (d - s.l * 1.5), 530 + Math.sin(ang) * (d - s.l * 1.5) * 0.55); ctx.stroke();
    }
    ctx.restore();
    const fl = 1 - prog(t, TL.title, TL.title + 0.14);
    if (fl > 0) { ctx.fillStyle = `rgba(255,255,255,${0.85 * fl})`; ctx.fillRect(0, 0, W, H); }
  }
}

// ---------------- frame ----------------
window.renderFrame = (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = "none";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  if (t < TL.shot2) shotGround(t);
  else if (t < TL.hit) shotFly(t);
  else if (t < TL.title - 0.16) shotGlass(t);
  else shotTitle(t);
  // letterbox vignette for a cinematic feel
  const v = ctx.createRadialGradient(960, 540, 600, 960, 540, 1250);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
};
